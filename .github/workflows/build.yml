name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer + main (electron-vite)
        run: npm run build
        env:
          # Optional override. The repo ships a working project key as the
          # default, so this only needs setting to point CI at a different
          # PostHog project (or to '' to build with reporting disabled).
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      - name: Package Windows installer (electron-builder, NSIS)
        run: npx electron-builder --win nsis --publish never
        env:
          # Unsigned build — don't attempt cert auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reliquary-windows-installer
          path: release/*.exe
          if-no-files-found: error

      # On a version tag (e.g. v0.1.0), attach the installer to a GitHub Release.
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
