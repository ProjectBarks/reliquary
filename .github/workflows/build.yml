name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer + main (electron-vite)
        run: npm run build
        env:
          # Optional override, only to point CI at a different PostHog project.
          # An unset repo variable materialises as an EMPTY STRING here, which is
          # why the config treats empty as "unset" and falls back to the shipped
          # key — v0.2.0 shipped with telemetry compiled out because it did not.
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      # The key is a public, write-only project key and is meant to be in the
      # binary. Assert it actually is, so a keyless build can never ship again:
      # such a build looks perfectly healthy and just silently reports nothing.
      - name: Verify telemetry key is embedded in the bundle
        shell: bash
        run: |
          if grep -q "phc_" out/main/index.js; then
            echo "OK: PostHog key present in out/main/index.js"
          else
            echo "FAIL: no PostHog key in the built bundle" >&2
            exit 1
          fi

      # On a v* tag this publishes the installer AND latest.yml to the GitHub
      # Release. latest.yml is the update feed electron-updater polls, so a
      # release without it is invisible to already-installed clients.
      - name: Package Windows installer (electron-builder, NSIS)
        run: npx electron-builder --win nsis --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          # Unsigned build — don't attempt cert auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reliquary-windows-installer
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

      # On a version tag (e.g. v0.1.0), attach the installer to a GitHub Release.
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
